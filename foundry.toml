[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
bytecode_hash = "none"
cbor_metadata = false
viaIR = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 20_000

# LpLocker exceeds EIP-170 24KB limit at 20k runs — use 200 runs for smaller bytecode
[profile.lplocker]
optimizer_runs = 200

[fmt]
line_length = 100
number_underscore = "thousands"
sort_imports = true
tab_width = 4